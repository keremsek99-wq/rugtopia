name: core-tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: dotnet test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Secret gate self-check
        run: bash Tools/ci/self-check.sh

      - name: Core tests
        run: dotnet test CoreTests --configuration Release --nologo
